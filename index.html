<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F141F">
<title>Between Stops Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{
  --ink:#182033; --ink2:#0F141F; --yellow:#FFC72C; --yellow-deep:#E0A800; --blue:#2D5BA8; --grey:#E9ECF1;
  --bg:#F4F6F9; --white:#fff; --muted:#5E6779; --line:#D7DCE4; --green:#2E7D5B; --mint:#3DDC97;
  --red:#C2402A; --cream:#FFF7DD; --held:#FFF1C7; --t1:#F28C1E; --salmon:#FFB4A6;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
}
html{font-size:16px}
html.big{font-size:18.9px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink2);overscroll-behavior:none}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{display:block}

/* ---------- Stage: a fixed 1280x860 kiosk screen scaled to fit any window ---------- */
#stage{position:fixed;left:50%;top:50%;width:1280px;height:860px;transform-origin:center;overflow:hidden;background:var(--bg);border-radius:0}
#app{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen.enter{animation:screenIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.dark{background:linear-gradient(180deg,var(--ink),var(--ink2));color:#fff}

/* ---------- Shared bits ---------- */
.top{display:flex;align-items:center;gap:22px;padding:20px 28px 0}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:15px;background:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.14);cursor:pointer;flex-shrink:0}
.brand-t{font-family:var(--serif);font-weight:600;font-size:1.65rem;line-height:1}
.brand-s{font-size:.95rem;font-weight:700;color:var(--muted);margin-top:3px}
.pill-btn{display:flex;align-items:center;gap:8px;height:56px;padding:0 18px;border-radius:999px;background:#fff;color:var(--blue);font-weight:700;font-size:1.25rem}
.journey{flex:1;display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:22px;background:#fff;min-width:0}
.t1{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--t1);color:var(--ink);font-weight:700;font-size:1.1rem;flex-shrink:0}
.round{width:56px;height:56px;border-radius:50%;background:#fff;font-weight:700;font-size:1.35rem;flex-shrink:0}
.round.on{background:var(--ink);color:#fff}
.clock{font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;white-space:nowrap}

.jb{flex:1;display:flex;align-items:center;gap:18px;min-width:0}
.jb-l{min-width:170px}
.jb-label{display:block;font-size:.85rem;font-weight:700;color:var(--muted)}
.jb-name{display:block;font-size:1.5rem;font-weight:700;white-space:nowrap}
.jb.dark .jb-label{color:rgba(255,255,255,.6)}
.jb.dark .jb-name{color:#fff}
.jb-track{position:relative;flex:1;height:40px}
.jb-track::before{content:"";position:absolute;left:0;right:0;top:17px;height:6px;border-radius:3px;background:var(--line)}
.jb.dark .jb-track::before{background:rgba(255,255,255,.15)}
.jb-fill{position:absolute;left:0;top:17px;height:6px;border-radius:3px;background:var(--yellow);width:0}
.jb-track::after{content:"";position:absolute;right:0;top:13px;width:14px;height:14px;border-radius:50%;border:4px solid var(--yellow);background:#fff;box-sizing:border-box}
.jb.dark .jb-track::after{background:var(--ink)}
.jb-train{position:absolute;top:3px;left:0;width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;box-shadow:0 0 10px rgba(224,168,0,.6);transition:left .25s linear}
.jb-min{width:64px;text-align:right;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.jb.dark .jb-min{color:rgba(255,255,255,.7)}
.jb-name.swap{animation:pushUp .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pushUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:72px;border-radius:22px;font-weight:700;font-size:1.4rem;transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:active,.press:active{transform:scale(.96)}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 8px 18px rgba(224,168,0,.35)}
.btn.ink{background:var(--ink);color:#fff}
.btn.w{background:#fff;color:var(--ink)}
.btn.ghost{border:2px solid var(--line);color:var(--ink)}
.btn.ghost-d{border:2px solid rgba(255,255,255,.25);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{height:60px;font-size:1.2rem}
.btn[disabled]{opacity:.45;box-shadow:none;pointer-events:none}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}

.title{font-size:2.5rem;font-weight:700;line-height:1.1}
.sub{font-size:1.2rem;color:var(--muted);margin-top:6px;line-height:1.4}
.serif{font-family:var(--serif);font-weight:600}

/* Book covers (same art as the phone app) */
.cover{position:relative;flex-shrink:0;border-radius:4px 9px 9px 4px;overflow:hidden;background:var(--c1);color:var(--c2);box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 8px 18px rgba(24,32,51,.25)}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover .ct{position:absolute;left:10%;right:10%;bottom:21%;font-family:var(--serif);font-weight:600;line-height:1.05}
.cover .ca{position:absolute;left:10%;right:10%;bottom:9%;font-size:.55em;opacity:.85}

/* Stars */
.stars{display:inline-flex;gap:2px;color:var(--yellow-deep);vertical-align:middle}
.dark .stars,.stars.light{color:var(--yellow)}

/* Countdown ring */
.ring{position:relative;flex-shrink:0;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--line)}
.ring.dk .tr{stroke:rgba(255,255,255,.15)}
.ring .fl{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:0;animation:ringDown var(--d) linear forwards}
.ring.dk .fl{stroke:#fff}
.ring b{font-variant-numeric:tabular-nums;font-size:1.4rem}
.ring.dk b{color:#fff}
@keyframes ringDown{to{stroke-dashoffset:var(--c)}}

/* ---------- Attract ---------- */
.attract{background:linear-gradient(180deg,var(--ink),var(--ink2));color:#fff;cursor:pointer}
.attract .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,20,31,.96),rgba(15,20,31,.6) 50%,transparent)}
.floaters{position:absolute;inset:0;overflow:hidden}
.floater{position:absolute;bottom:-300px;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-640px) rotate(calc(var(--r) * -1)) translateX(20px)}to{transform:translateY(-1280px) rotate(var(--r))}}
.att-in{position:absolute;inset:44px 64px 0;display:flex;flex-direction:column}
.att-top{display:flex;justify-content:space-between;align-items:center}
.att-top .journey{flex:none;width:560px;background:rgba(255,255,255,.07)}
.att-title{font-family:var(--serif);font-weight:600;font-size:6.5rem;line-height:1;margin-top:auto;animation:upIn .9s cubic-bezier(.2,.8,.2,1) both}
.att-sub{font-size:1.9rem;color:rgba(255,255,255,.7);margin-top:8px;animation:upIn .9s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes upIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.fact{display:flex;gap:12px;align-items:center;font-size:1.4rem;font-weight:700;color:rgba(255,255,255,.85);margin-top:34px;height:34px;overflow:hidden}
.fact span{animation:pushUp .6s cubic-bezier(.2,.8,.2,1)}
.att-cta{display:flex;align-items:center;gap:22px;margin-top:34px;margin-bottom:190px}
.touch{display:flex;align-items:center;gap:14px;height:84px;padding:0 34px;border-radius:999px;background:var(--yellow);color:var(--ink);font-size:1.75rem;font-weight:700;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 10px rgba(255,199,44,.2);transform:scale(1)}50%{box-shadow:0 0 34px rgba(255,199,44,.6);transform:scale(1.04)}}
.att-cta p{font-size:1.2rem;color:rgba(255,255,255,.65);line-height:1.4}
.track{position:absolute;left:0;right:0;bottom:34px;height:90px}
.track::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;background:rgba(255,255,255,.12)}
.train{position:absolute;bottom:0;display:flex;gap:6px;animation:roll 15s linear infinite}
@keyframes roll{from{transform:translateX(-1000px)}to{transform:translateX(1320px)}}
.car{position:relative;width:112px;height:52px;border-radius:10px;background:rgba(255,255,255,.14);display:flex;justify-content:center;gap:8px;padding-top:11px;animation:bob .45s ease-in-out infinite alternate}
.car:nth-child(odd){animation-delay:-.2s}
.car i{width:22px;height:14px;border-radius:3px;background:rgba(255,255,255,.22)}
.car.lib{background:var(--yellow)}
.car.lib i{background:rgba(24,32,51,.3)}
.car.lib::before{content:"";position:absolute;top:-24px;left:44px;width:24px;height:18px;background:linear-gradient(90deg,#fff 0 5px,transparent 5px 9px,#fff 9px 14px,transparent 14px 18px,#fff 18px 23px);clip-path:polygon(0 12%,22% 12%,22% 30%,39% 30%,39% 0,60% 0,60% 100%,0 100%);}
.car.head{border-top-right-radius:28px}
.car.tail{border-top-left-radius:28px}
@keyframes bob{to{transform:translateY(-1.5px)}}

/* ---------- Home ---------- */
.home-body{flex:1;display:flex;gap:24px;padding:22px 28px 28px;min-height:0}
.collect{flex:1;display:flex;flex-direction:column;gap:18px;padding:26px;border-radius:34px;background:var(--ink);color:#fff;min-width:0;animation:slideL .6s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.collect h2{font-size:2.5rem}
.collect .sub{color:rgba(255,255,255,.7);margin-top:4px}
.side{width:420px;display:flex;flex-direction:column;gap:16px}
.tile{display:flex;align-items:center;gap:18px;padding:20px;min-height:116px;border-radius:28px;background:#fff;text-align:left;width:100%;animation:slideR .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.tile .ic{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;flex-shrink:0}
.tile b{display:block;font-size:1.5rem}
.tile span{display:block;font-size:1rem;color:var(--muted);margin-top:4px}
.tile .chev{margin-left:auto;color:var(--line)}
.fan{position:relative;width:76px;height:76px;flex-shrink:0}
.fan .cover{position:absolute;left:15px;top:4px;transform-origin:bottom center}
.stats{display:flex;gap:12px;margin-top:auto;animation:slideR .55s .26s cubic-bezier(.2,.8,.2,1) both}
.stat{flex:1;padding:18px;border-radius:24px;background:#fff}
.stat b{display:block;font-size:2.1rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.95rem;opacity:.7}
.stat.blue{background:var(--blue);color:#fff}

/* Viewfinder */
.vf{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2B3550,#10151F 75%)}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .4s}
.vf.live video{opacity:.92}
.vf.live .phone{display:none}
.vf .frame{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);transform:translate(-50%,-50%);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.97)}50%{transform:translate(-50%,-50%) scale(1.03)}}
.vf .frame b{position:absolute;width:20%;height:20%;border:7px solid var(--yellow)}
.vf .frame b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.vf .frame b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.vf .frame b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
.vf .frame b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
.vf .sweep{position:absolute;left:5%;right:5%;height:3px;border-radius:2px;background:var(--yellow);box-shadow:0 0 12px var(--yellow);animation:sweep 4s ease-in-out infinite}
@keyframes sweep{0%,100%{top:8%}50%{top:88%}}
.vf .hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.45);font-size:1.05rem;font-weight:700;color:rgba(255,255,255,.88);white-space:nowrap;z-index:2}
.vf .flash{position:absolute;inset:0;background:var(--yellow);opacity:0;pointer-events:none}
.vf .flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
.phone{position:absolute;left:50%;top:50%;width:150px;height:290px;margin:-145px 0 0 -75px;border-radius:26px;background:#fff;border:6px solid #1B1D22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);animation:hold 4.4s ease-in-out infinite}
.phone small{font-size:.8rem;font-weight:700}
.phone .qr{width:104px;height:104px}
.phone b{font-variant-numeric:tabular-nums}
.phone.book{width:150px;height:210px;margin:-105px 0 0 -75px;border:0;border-radius:6px 10px 10px 6px;background:#5B8DB8}
.phone.book .bc{background:#fff;padding:8px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.55rem;font-family:monospace}
.phone.book .bars{width:84px;height:40px;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 4px,#000 4px 5px,transparent 5px 8px)}
@keyframes hold{0%,100%{transform:translateY(260px) scale(.6) rotate(-8deg);opacity:.6}50%{transform:translateY(0) scale(.82) rotate(0);opacity:1}}
.demo{display:flex;flex-direction:column;gap:10px}
.demo-h{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;font-weight:700;color:rgba(255,255,255,.7)}
.demo-h button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:.95rem}
.chips-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.dchip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;text-align:left;flex-shrink:0}
.dchip b{display:block;font-size:1rem}
.dchip span{display:block;font-size:.8rem;opacity:.7}

/* ---------- Locker wall ---------- */
.wall{display:grid;grid-template-columns:repeat(4,var(--w));gap:12px;padding:18px;border-radius:30px;background:linear-gradient(180deg,#2A3349,#1A2133);box-shadow:0 18px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);perspective:1400px;flex-shrink:0}
.door{position:relative;width:var(--w);height:calc(var(--w) * 1.32);transform-style:preserve-3d}
.cav{position:absolute;inset:0;border-radius:14px;background:#0B0F18;display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(255,255,255,.06);transition:box-shadow .4s}
.door.open .cav{box-shadow:inset 0 0 50px rgba(255,199,44,.4)}
.cav .cover{transition:opacity .3s,transform .4s}
.door.empty-out .cav .cover{opacity:0;transform:translateX(40px) scale(.6)}
.glass{position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 50%,rgba(255,255,255,.12));border:2px solid rgba(255,255,255,.25);transform-origin:left center;transition:transform .9s cubic-bezier(.3,1.35,.5,1),box-shadow .9s;overflow:hidden;backface-visibility:visible}
.glass::before{content:"";position:absolute;left:12%;top:-20%;width:12%;height:140%;background:rgba(255,255,255,.12);transform:rotate(24deg)}
.door.open .glass{transform:rotateY(-112deg);box-shadow:-10px 0 20px rgba(0,0,0,.4)}
.door .lbl{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.4);color:rgba(255,255,255,.88);font:700 calc(var(--w) * .11) ui-monospace,Menlo,monospace}
.door .lk{position:absolute;top:8px;right:8px;width:calc(var(--w) * .2);height:calc(var(--w) * .2);border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.door .hd{position:absolute;right:8px;top:39%;width:5px;height:22%;border-radius:3px;background:rgba(255,255,255,.5)}
.door .led{position:absolute;bottom:8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(255,255,255,.25)}
.door .led.ok{background:var(--mint)}
.door .led.hold{background:var(--t1)}
.door.open .led{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.door::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:5px solid var(--yellow);opacity:0;transition:opacity .12s;pointer-events:none}
.door.hl::after{opacity:1;animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 8px var(--yellow)}to{box-shadow:0 0 24px var(--yellow)}}
.door .arrow{position:absolute;left:50%;top:-34px;margin-left:-30px;width:60px;height:60px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;box-shadow:0 0 14px rgba(255,199,44,.6);animation:bounce .6s ease-in-out infinite alternate;z-index:5}
@keyframes bounce{to{transform:translateY(-20px)}}

/* ---------- Flow layouts (unlock / return) ---------- */
.flow{flex:1;display:flex;align-items:center;gap:48px;padding:0 48px}
.flow .wall-col{display:flex;flex-direction:column;align-items:center;gap:18px}
.flow .wall-cap{font-size:1rem;font-weight:700;color:rgba(255,255,255,.4)}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.hi{font-size:1.5rem;font-weight:700;color:var(--yellow)}
.big-h{font-size:2.75rem;font-weight:700;line-height:1.1}
.muted-d{font-size:1.3rem;color:rgba(255,255,255,.75);line-height:1.45}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.passchip{display:inline-flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.08);font-size:1.25rem;font-weight:700;align-self:flex-start}
.ok-tick{color:var(--mint);transform:scale(.2);opacity:0;transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.ok-tick.on{transform:none;opacity:1}
.door-pill{align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--yellow);color:var(--ink);font-weight:700;font-size:1.1rem}
.fly{animation:flyOut .8s cubic-bezier(.3,1.3,.5,1) both}
@keyframes flyOut{from{opacity:0;transform:translateX(-360px) scale(.35) rotate(-20deg)}to{opacity:1;transform:rotate(-4deg)}}
.facts{display:flex;gap:12px}
.facts div{flex:1;padding:16px;border-radius:18px;background:rgba(255,255,255,.07)}
.facts i{color:var(--yellow);font-style:normal}
.facts b{display:block;font-size:1.4rem;margin-top:4px}
.facts span{font-size:.9rem;color:rgba(255,255,255,.55)}
.jump{display:flex;gap:18px;align-items:center;padding:18px;border-radius:22px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,199,44,.5);animation:popIn .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.jump .bm{width:60px;height:60px;border-radius:18px;background:var(--yellow);display:grid;place-items:center;flex-shrink:0}
.jump b{font-size:1.4rem}

let actx;
function chime(notes = [660, 880], len = .12){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + len * 2.5);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len * 3);
    });
  } catch {}
}

/* ---------- Confetti ---------- */
function confetti(ox = .5, oy = .45, n = 140){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const pal = ['#FFC72C','#2D5BA8','#ffffff','#F28C1E','#1F7A6B','#E8B4BC','#C2402A'];
  const bits = Array.from({ length: n }, () => {
    const a = -Math.PI * (.05 + Math.random() * .9), sp = 500 + Math.random() * 800;
    return { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, spin: (Math.random() - .5) * 18, s: 10 + Math.random() * 10, w: Math.random() * 6, c: pal[Math.random() * pal.length | 0], book: Math.random() < .25 };
  });
  const t0 = performance.now(), X = 1280 * ox, Y = 860 * oy;
  (function frame(now){
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, 1280, 860);
    if (t > 4.5) return;
    ctx.globalAlpha = Math.max(0, Math.min(1, 4.2 - t));
    for (const b of bits){
      const x = X + b.vx * t + Math.sin(t * 6 + b.w) * 10, y = Y + b.vy * t + 650 * t * t;
      if (y > 900) continue;
      ctx.save(); ctx.translate(x, y); ctx.rotate(b.spin * t); ctx.fillStyle = b.c;
      if (b.book){ ctx.fillRect(-b.s*.4, -b.s*.6, b.s*.8, b.s*1.2); ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-b.s*.4, -b.s*.6, 2.5, b.s*1.2); }
      else ctx.fillRect(-b.s/2, -b.s/4, b.s, b.s/2);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  })(t0);
}

/* ============================================================
   LOGIC: scanning, collecting, returning
   ============================================================ */
function parse(raw){
  const s = String(raw).trim();
  if (/^betweenstops:\/\//i.test(s)){
    const u = new URL(s.replace(/^betweenstops:\/\//i, 'https://x/'));
    const kind = u.pathname.replace(/\//g, '').toLowerCase();
    const q = Object.fromEntries(u.searchParams);
    if (kind === 'collect') return { type:'collect', code:q.code, book:q.book, name:q.name || null, exp:q.exp ? +q.exp * 1000 : null };
    if (kind === 'return' && q.book) return { type:'return', book:q.book };
    return null;
  }
  const b = S.books.find(b => b.barcode === s);
  if (b) return { type:'return', book:b.id };
  const d = s.replace(/[\s-]/g, '');
  if (/^\d{6}$/.test(d)) return { type:'collect', code:d };
  if (/^\d{4}$/.test(d)) return { type:'quick', pin:d };
  return null;
}
function showAlert(icon, title, msg, bookId){
  S.alert = true;
  const b = bookId && book(bookId);
  openOverlay(`<div class="alert" data-a="close-alert"><div class="card" data-a="noop">${b ? cover(b, 170) : ''}
    <div><span class="ic">${icon}</span><h3>${esc(title)}</h3><p>${esc(msg)}</p>
    <div class="acts"><button class="btn y sm press" style="width:220px" data-a="close-alert">Try again</button>${b && S.route !== 'browse' ? `<button class="btn ghost sm press" style="width:240px" data-a="go" data-to="browse">Browse the shelf</button>` : ''}</div></div></div></div>`);
  chime([330, 262], .12);
}
function handleScan(raw, returning = false){
  touch();
  const p = parse(raw);
  if (!p) return showAlert(I.qr(34), "That code isn't one of ours", 'Open the Between Stops app, tap your reservation and hold the QR code up to the camera.');
  if (p.type === 'return') return startReturn(p.book);
  if (returning) return showAlert(I.ret(34), "That's a reservation pass", 'To return a book, scan the code on its back cover. To collect, go back and scan your pass on the main screen.');
  if (p.type === 'quick') return collectQuick(p.pin);
  collect(p);
}
function collectQuick(code){
  const r = S.reservations.find(r => r.pin === code);
  if (r) return collect({ code:r.code, book:r.book, name:r.name });
  const b = S.books.find(b => b.num === +code.slice(0, 2));
  if (!b) return showAlert(I.grid(34), "We couldn't find that quick code", 'Check the 4 digit quick code under your QR in the app. Codes last 30 minutes.');
  collect({ book:b.id });
}
function collect({ code, book:bookId, name, exp }){
  if (exp && exp < Date.now()) return expired(bookId);
  const r = code && S.reservations.find(r => r.code === code);
  if (r){
    if (r.collected) return showAlert(I.check(34), 'Already collected', `${book(r.book)?.title || 'This book'} was collected with this pass earlier. Enjoy the read!`, r.book);
    if (r.exp < Date.now()) return expired(r.book);
    const s = slotOf(r.book);
    if (!s) return notHere(r.book);
    return go('unlock', { book:r.book, slot:s.id, name:r.name, code:r.code });
  }
  if (!bookId || !book(bookId)) return showAlert(I.grid(34), "We couldn't find that code", 'Check the six digit code in the app and try again. Codes are only valid for 30 minutes.');
  const s = slotOf(bookId);
  if (!s) return notHere(bookId);
  if (s.hold && s.hold !== code) return showAlert(I.lock(34), 'Someone else has this one', `${book(bookId).title} is held for another reader. Browse the shelf for something else to read.`, bookId);
  if (code) S.reservations.push({ code, book:bookId, name:name || 'Reader', exp: Date.now() + 30*60e3 });
  go('unlock', { book:bookId, slot:s.id, name:name || null, code:code || null });
}
const expired = id => showAlert(I.clock(34), 'This reservation has expired', 'Holds last 30 minutes. If the book is still on the shelf you can borrow it straight away from Browse.', id);
const notHere = id => showAlert(I.tram(34), 'Wrong train', `${book(id)?.title || 'That book'} is riding a different train right now. Check the app for the train and car it's on.`, id);

function completeCollect(job){
  const s = S.slots.find(s => s.id === job.slot);
  s.book = null; s.hold = null;
  const r = job.code && S.reservations.find(r => r.code === job.code);
  if (r) r.collected = true;
  S.loans[job.book] = job.name || 'Reader';
  book(job.book).trips.unshift([`Collected from car ${CAR} at ${station(S.nextStop - 1)}${job.name ? ' by ' + job.name : ''}`, 'Just now']);
  S.borrowed++;
}
function startReturn(id){
  if (!book(id)) return showAlert(I.book(34), "We don't know that book", 'Only books with a Between Stops sticker can go in the kiosk.');
  if (slotOf(id)) return showAlert(I.book(34), 'That book is already on the shelf', "Looks like it's already in one of our doors. Try scanning a different book.", id);
  if (!doorForReturn()) return showAlert(I.door(34), 'This shelf is full', 'Every door is in use. Car 5 has a library too, or keep it for your next trip.');
  go('place', id);
}
function doorForReturn(){
  const rank = s => s.id[0] === 'B' ? 0 : s.id[0] === 'A' ? 1 : 2;
  return S.slots.filter(s => !s.book).sort((a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id))[0];
}
function bookmarkFor(reader, id){ return reader ? S.bookmarks[reader]?.[id] : undefined; }

/* ============================================================
   ACTIONS (all taps go through here)
   ============================================================ */
const ACTIONS = {
  noop(){},
  start(){ go('home'); },
  home(){ go('home'); },
  go(d){ go(d.to); },
  close(){ closeOverlay(); surprise.n++; },
  'close-alert'(d, el, e){ if (e.target.closest('[data-a]') !== el) return; S.alert = null; closeOverlay(); },
  textsize(){
    document.documentElement.classList.toggle('big');
    const on = document.documentElement.classList.contains('big');
    $$('[data-a="textsize"]').forEach(b => { b.classList.toggle('on', on); $('.switch', b)?.classList.toggle('on', on); });
    toast(on ? 'Larger text on' : 'Larger text off');
  },
  scan(d){ handleScan(d.code, !!d.ret); },
  async paste(d){
    try { const t = await navigator.clipboard.readText(); if (t) return handleScan(t, !!d.ret); } catch {}
    toast('Copy a pass link from the pass maker first');
  },
  key(d){
    if (d.t === 'code'){
      const n = C.quick ? 4 : 6;
      C.digits = d.k === 'del' ? C.digits.slice(0, -1) : d.k === 'clear' ? '' : (C.digits.length < n ? C.digits + d.k : C.digits);
      $('#code-left').innerHTML = codeLeft();
      const btn = $('#code-go'); btn.disabled = C.digits.length < n; btn.textContent = C.quick ? 'Unlock with quick code' : 'Unlock my book';
    } else if (d.t === 'page'){
      R.page = d.k === 'del' ? R.page.slice(0, -1) : d.k === 'clear' ? '' : (R.page.length < 4 ? (R.page + d.k).replace(/^0+/, '') : R.page);
      updatePage();
    } else if (d.t === 'pin'){
      if (d.k === 'del') pin = pin.slice(0, -1); else if (d.k === 'clear') pin = ''; else if (pin.length < 4) pin += d.k;
      $$('#dots i').forEach((dot, i) => dot.classList.toggle('on', i < pin.length));
      if (pin.length === 4){
        if (pin === '2468') { $('#staff').innerHTML = dashView(); chime([523, 784], .08); }
        else { const dots = $('#dots'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); setTimeout(() => { pin = ''; $$('#dots i').forEach(i => i.classList.remove('on')); }, 450); }
      }
    }
  },
  'code-mode'(d){ C.quick = !!d.q; C.digits = ''; $('#code-left').innerHTML = codeLeft(); const b = $('#code-go'); b.disabled = true; b.textContent = C.quick ? 'Unlock with quick code' : 'Unlock my book'; },
  'code-go'(){
    const known = C.quick ? S.reservations.some(r => r.pin === C.digits) || S.books.some(b => b.num === +C.digits.slice(0, 2)) : S.reservations.some(r => r.code === C.digits);
    const digits = C.digits;
    if (!known){ const bx = $('#boxes'); bx.classList.remove('shake'); void bx.offsetWidth; bx.classList.add('shake'); C.digits = ''; setTimeout(() => { if (S.route === 'code') $('#code-left').innerHTML = codeLeft(); }, 460); }
    handleScan(digits);
  },
  'got-it'(){ finishCollect(S.job); },
  placed(){
    const pb = $('#placing-book .cover');
    if (pb){ pb.style.transition = 'all .45s ease-in'; pb.style.transform = 'translateX(-260px) scale(.4)'; pb.style.opacity = '0'; }
    const my = runId;
    setTimeout(() => {
      if (my !== runId) return;
      const s = S.slots.find(s => s.id === R.slot); s.book = R.book; s.hold = null;
      const b = book(R.book); b.trips.unshift([`Returned to car ${CAR} at ${station(S.nextStop - 1)}`, 'Just now']); b.km += 8 + (Math.random() * 18 | 0);
      S.returned++; S.km += 14;
      const door = doorEl(R.slot);
      $('.arrow', door)?.remove();
      $('.cav', door).innerHTML = cover(b, Math.round(138 * .62), false);
      $('.led', door).className = 'led ok';
      setTimeout(() => { door.classList.remove('open'); chime([392, 330], .08); }, 250);
      setTimeout(() => { if (my === runId) setPhase('choice'); }, 1300);
    }, 450);
  },
  phase(d){ setPhase(d.p); },
  thank(d){ thank(d.o); },
  star(d){
    R.stars = +d.n;
    $$('#starpick button').forEach((b, i) => b.classList.toggle('on', i < R.stars));
    $('#starlab').textContent = STAR_LABELS[R.stars];
    $('#post').disabled = false;
    chime([500 + R.stars * 80], .05);
  },
  tag(d, el){
    R.tags.has(d.t) ? R.tags.delete(d.t) : R.tags.add(d.t);
    el.classList.toggle('on', R.tags.has(d.t));
    el.innerHTML = `${R.tags.has(d.t) ? I.check(16) : I.plus(16)} ${esc(d.t)}`;
  },
  anon(){ R.anon = !R.anon; $('#anon').innerHTML = R.anon ? I.eyeOff() + ' Posting anonymously' : I.user() + ` Posting as ${esc(R.reader || 'Reader')}`; },
  'post-review'(){
    if (!R.stars) return;
    const b = book(R.book), text = R.text.trim(), by = R.anon ? `A reader at ${station(S.nextStop - 1)}` : (R.reader || 'Reader');
    b.reviews.unshift({ stars:R.stars, text, tags:TAGS.filter(t => R.tags.has(t)), by, when:'Just now' });
    const noteText = text || [...R.tags][0];
    if (noteText) b.note = { text:noteText, by };
    if (R.reader && S.bookmarks[R.reader]) delete S.bookmarks[R.reader][R.book];
    persist();
    thank('reviewed', { stars:R.stars });
  },
  'save-page'(){
    const p = +R.page, b = book(R.book);
    if (!(p > 0 && p <= b.pages)) return;
    const who = R.reader || 'Reader';
    (S.bookmarks[who] ||= {})[R.book] = p;
    persist();
    thank('saved', { page:p });
  },
  genre(d){ genre = d.g; $$('.gchip').forEach(c => c.classList.toggle('on', c.dataset.g === genre)); $('#grid').innerHTML = gridHtml(); },
  detail(d){ openDetail(d.id); },
  appqr(d){ openDetail(d.id, !$('.appqr')); },
  borrow(d){ const s = slotOf(d.id); if (s && !s.hold) go('unlock', { book:d.id, slot:s.id, name:null, code:null }); },
  surprise(){ surprise(); },
  'reel-look'(){ const id = surprise.pick; surprise.n++; closeOverlay(); openDetail(id); },
  guard(d, el){ el.innerHTML = `${I.check()} Help is on the way`; el.classList.replace('y', 'ink'); toast('The train guard has been notified'); },
  report(d, el){ $$('[data-a="report"]').forEach(b => b.classList.remove('on')); el.classList.add('on'); toast("Thanks, we've let the crew know"); },
  'staff-door'(d){ S.openDoors.has(d.id) ? S.openDoors.delete(d.id) : S.openDoors.add(d.id); doorEl(d.id).classList.toggle('open', S.openDoors.has(d.id)); },
  doors(d){ S.slots.forEach(s => d.v === 'open' ? S.openDoors.add(s.id) : S.openDoors.delete(s.id)); $$('.door').forEach(e => e.classList.toggle('open', d.v === 'open')); },
  'demo-toggle'(d, el){ S.showDemo = !S.showDemo; $('.switch', el).classList.toggle('on', S.showDemo); },
  reset(){ try { localStorage.removeItem('bs-kiosk-account'); } catch {} freshState(); S.route = 'staff'; $('#staff').innerHTML = dashView(); toast('Shelf restocked and demo data reset'); },
  fullscreen(){ const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.a];
  if (fn) fn(el.dataset, el, e);
});

/* Long press on the logo opens crew mode */
let holdTimer;
document.addEventListener('pointerdown', e => {
  touch();
  if (!actx) chime([0.0001], .001);  // unlock audio on first touch
  const h = e.target.closest('[data-hold]');
  if (h){ holdTimer = setTimeout(() => go(h.dataset.hold), 2000); }
});
['pointerup','pointercancel','pointerleave'].forEach(t => document.addEventListener(t, () => clearTimeout(holdTimer)));
document.addEventListener('keydown', e => { touch(); if (e.key === 'Escape'){ closeOverlay(); S.alert = null; } });
document.addEventListener('input', touch);

/* ---------- Global ticks: journey, countdowns, idle ---------- */
setInterval(() => {
  updateJourney();
  $$('[data-until]').forEach(el => el.textContent = Math.max(0, Math.ceil((+el.dataset.until - Date.now()) / 1000)));
}, 250);
setInterval(() => {
  const idle = (Date.now() - S.lastTouch) / 1000;
  if (S.route === 'attract' || S.route === 'unlock') return;
  if (S.route === 'home'){ if (idle > 90) go('attract'); return; }
  const limit = S.route === 'staff' ? 120 : 45;
  if (idle > limit + 12) return go('home');
  if (idle > limit && !S.still){
    S.still = true;
    $('#stage').insertAdjacentHTML('beforeend', `<div class="still" data-a="noop"><div class="card">${ring(12, 110)}<h2 class="title">Still there?</h2><p class="sub">We'll head back to the start screen soon.</p><button class="btn y press" style="width:320px" data-a="noop">I'm still here</button></div></div>`);
  }
}, 1000);

/* ---------- Fit the 1280x860 kiosk screen to any window ---------- */
function fit(){
  const s = Math.min(innerWidth / 1280, innerHeight / 860);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);
fit();
go('attract');
</script>
</body>
</html>
